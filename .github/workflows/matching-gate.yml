# Matching gate. This workflow answers one question:
# "Does the new material really match the retail binary?"
#
# It needs these settings:
#   secrets.ORIG_DEPLOY_KEY   read-only deploy key of the private companion repository
#                             (the retail executable and the Sony toolchain)
#   vars.PRIVATE_ORIG_REPO    the private companion repository, for example owner/at2-orig
#
# A pull request from a fork cannot get the secret or the variable. Then this job
# runs its notice step only. It does not fail.
#
# Three modes. The job itself always runs, so a mode never leaves a required check pending.
# tools/ci/classify_change.py decides the mode from the change set (default deny: any error,
# any push, and any manual run are `full`):
#   skip  a pull request whose changes are all documentation or pure tests
#         (tools/check/test_*.py). No build, no private checkout.
#   fast  a pull request whose changes are all in src/matched/**, progress/**,
#         config/** (except the two files splat reads), or documentation.
#         The baseline is assembled but not linked; the mixed build, the delta check, and the
#         report still run, and the mixed payload is compared against the retail payload, so
#         the image is verified byte for byte. The separate "the pure-asm baseline also
#         rebuilds the retail image" assertion runs on every push to main instead.
#   full  everything else: every push, every manual run, and any change that touches a build
#         input. This runs the whole pipeline, including the baseline link and its payload.
#
# The build has one optional accelerator. When the maintainer has packed the `splat split`
# output into the private companion repository (tools/ci/splat_snapshot.py create), the step
# below restores that archive instead of running splat again, which saves about 150 s. The
# archive may also carry the assembled objects (`build/asm/**/*.o`); when it does and they still
# match this checkout, build.sh skips the assembler too (another ~25 s). The public repository
# only carries toolchain/splat-snapshot.json (hashes and counts). Any mismatch prints a warning
# and falls back for that group, so the gate never depends on the archive for correctness: the
# mixed payload is still compared against the retail payload.
#
# 构建有一个可选加速器：维护者若已用 tools/ci/splat_snapshot.py create 把 `splat split` 的输出
# 打包进私有伴生仓库，下面的步骤就还原归档而不再跑 splat（省约 150 s）。归档还可以带上汇编产物
# （`build/asm/**/*.o`）；命中且仍匹配当前检出时，build.sh 连汇编也跳过（再省约 25 s）。公开仓库只带
# toolchain/splat-snapshot.json（哈希与计数）。任何不匹配都打警告并**对该组**回落，门禁的正确性
# 从不依赖归档：混合载荷仍与零售载荷比对。
#
# A manual run can verify a pull request. Give the pull request number as input.
#
# A manual run uses the secret, and it runs the scripts of that commit, so it may only target a
# pull request from THIS repository: the guard step below checks `head.repo.full_name` before any
# checkout. A fork pull request cannot be verified by a manual run, because the private companion
# repository (retail executable and Sony toolchain) would sit on the same runner as the fork's
# own scripts (R30 finding A4). Review a fork contribution by merging it into a branch of this
# repository first; the regular `pull_request` run of a fork cannot get the secret at all.
#
# 手动运行会用私钥，并会执行那个提交里的脚本，因此只允许指向**本仓库**的 PR（下面的守卫步骤在
# 任何 checkout 之前核对 `head.repo.full_name`）。fork PR 不能靠手动运行验证：门禁需要的私有
# 伴生仓库（原版可执行文件与 Sony 工具链）会和 fork 自己的脚本同处一个 runner（R30 A4）。
# 要审 fork 贡献，先把它合并进本仓库的分支；fork 的普通 `pull_request` 运行本来就拿不到 secret。
name: matching-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to verify (optional)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read   # the manual-run guard reads the pull request's head repository
                        # 手动运行的守卫要读 PR 的 head 仓库

concurrency:
  group: matching-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matching:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_ORIG: ${{ secrets.ORIG_DEPLOY_KEY != '' && vars.PRIVATE_ORIG_REPO != '' }}
      PRIVATE_ORIG_REPO: ${{ vars.PRIVATE_ORIG_REPO }}
    steps:
      - name: Notice (no secret, for example a pull request from a fork)
        if: env.HAS_ORIG != 'true'
        run: |
          echo "::notice::The secret ORIG_DEPLOY_KEY or the variable PRIVATE_ORIG_REPO is absent. Skip the build gate."

      # The manual run must not execute a fork's scripts. This guard runs BEFORE every checkout,
      # so a rejected fork PR never reaches the private companion download or its scripts.
      # 手动运行不得执行 fork 的脚本。守卫排在**所有 checkout 之前**：被拒的 fork PR 不会走到
      # 私有伴生仓库下载，也不会执行它的脚本。
      - name: Guard the manual run (same-repository pull requests only)
        if: env.HAS_ORIG == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr }}" --jq .head.repo.full_name)"
          if [ "$head" != "${{ github.repository }}" ]; then
            echo "::error::a manual run may verify only a pull request from ${{ github.repository }} (got: $head). Merge the contribution into a branch of this repository first."
            exit 1
          fi
          echo "::notice::manual-run guard passed: PR #${{ github.event.inputs.pr }} comes from $head"

      - name: Checkout this repository
        if: env.HAS_ORIG == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || github.sha }}
          fetch-depth: 0            # the mode and the delta check need the base commit
          persist-credentials: false

      # The mode decides which of the steps below run. It runs before the private checkout so
      # that a documentation or pure-test pull request never downloads the retail material.
      # 模式决定下面哪些步骤运行；它排在私有取件之前，让纯文档 / 纯测试 PR 完全不下载受限材料。
      - name: Classify the change (skip / fast / full)
        id: mode
        if: env.HAS_ORIG == 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          base="${PR_BASE:-}"
          if [ -z "$base" ]; then base="${BEFORE:-}"; fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            git fetch --quiet --no-tags origin "$base" 2>/dev/null || true
          fi
          mode="$(python3 tools/ci/classify_change.py --root . --event "$EVENT" --base "$base" --head HEAD --verbose)" || mode=full
          case "$mode" in skip|fast|full) ;; *) mode=full ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice::build mode = $mode"

      - name: Notice (documentation or pure tests only, the build gate is skipped)
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode == 'skip'
        run: |
          echo "::notice::Every changed file is documentation or a pure test. No build runs. The validate workflow still checks the repository and runs the tests."

      - name: Checkout the private companion (retail executable and Sony toolchain)
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_ORIG_REPO }}
          ssh-key: ${{ secrets.ORIG_DEPLOY_KEY }}
          path: .orig
          persist-credentials: false

      # Python first: `use` extracts with `tarfile ... filter="data"`, which needs Python 3.12+
      # (or a 3.11.4+ backport). Running it before `actions/setup-python` meant it used whatever
      # the runner image happened to ship, and a TypeError was outside its fallback handling.
      # 先装 Python：`use` 解包时用 `tarfile ... filter="data"`，需要 Python 3.12+（或 3.11.4+ 的回移）。
      # 排在 `actions/setup-python` 之前会用到 runner 镜像自带的版本，且 TypeError 不在它的回落处理里。
      - uses: actions/setup-python@v5
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        with:
          python-version: '3.13'

      # `splat split` is about 150 s of the build, it is single-threaded, and its output is a
      # pure function of the retail executable plus a few inputs that rarely change. The
      # maintainer packs that output once (tools/ci/splat_snapshot.py create) and pushes the
      # archive to the private companion repository; this repository only carries
      # toolchain/splat-snapshot.json, which holds hashes and counts, never content. Every
      # reason to distrust the archive prints a warning and falls back to running splat.
      # `splat split` 占构建约 150 s、单线程，且输出只是原版可执行文件与少数输入的纯函数。维护者
      # 用 tools/ci/splat_snapshot.py create 打包一次并把归档推到私有伴生仓库；本仓库只带
      # toolchain/splat-snapshot.json（哈希与计数，无内容）。任何存疑都打警告并回落真 splat。
      - name: Use the packaged splat output when it matches this checkout
        id: snapshot
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: python3 tools/ci/splat_snapshot.py use --project . --orig .orig --extract --github-output "$GITHUB_OUTPUT"

      - name: Install the toolchain and check each sha256
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tc"
          for a in e32.tar.xz ee-gcc2.96.tar.xz b10.tar.gz ld244.tar.xz; do
            cp ".orig/toolchain/$a" "$HOME/tc/$a"
          done
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          lock = json.loads(pathlib.Path("toolchain.lock.json").read_text())
          want = {c["archive"]: c["sha256"] for c in lock["compilers"].values()}
          for name, digest in want.items():
              p = pathlib.Path.home() / "tc" / name
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != digest:
                  sys.exit(f"sha256 mismatch for {name}: {got} != {digest}")
              print(f"ok {name} {got}")
          PY
          # Extract each archive into its own directory. Both ee-gcc archives contain
          # bin/ee-gcc, so one archive would overwrite the other.
          # 每个归档解到自己的目录：两个 ee-gcc 归档里都有 bin/ee-gcc，混在一起会互相覆盖。
          mkdir -p "$HOME/tc/e32" "$HOME/tc/cri" "$HOME/tc/bin" "$HOME/tc/ld"
          tar -xf "$HOME/tc/e32.tar.xz"        -C "$HOME/tc/e32"   # ee-gcc 3.2-ee-040921
          tar -xf "$HOME/tc/ee-gcc2.96.tar.xz" -C "$HOME/tc/cri"   # ee-gcc 2.96 (spare)
          tar -xf "$HOME/tc/b10.tar.gz"        -C "$HOME/tc/bin"   # PS2 binutils (the archive is flat)
          tar -xf "$HOME/tc/ld244.tar.xz"      -C "$HOME/tc/ld"    # the Debian 2.44 ld and its libraries

      # The build scripts read these variables. Without them they fall back to
      # the maintainer's home directory, which does not exist on the runner.
      - name: Wire the toolchain into the build
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          BIN="$HOME/tc/bin"
          GCC="$HOME/tc/e32/bin/ee-gcc"
          LD="$HOME/tc/ld/bin/mips-linux-gnu-ld.bfd"
          LIBDIR="$HOME/tc/ld/lib/x86_64-linux-gnu"
          # Shared libraries that ship with ee-gcc. The value is empty when the archive has none, and that is harmless.
          # ee-gcc 自带的共享库（若归档里没有就是空，不影响）
          for d in $(find "$HOME/tc/e32" -type d -name lib | head -5); do LIBDIR="$LIBDIR:$d"; done
          for f in "$BIN/mips-ps2-decompals-as" "$GCC" "$LD"; do
            [ -x "$f" ] || { echo "::error::toolchain component missing or not executable: $f"; exit 1; }
          done
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}:$LIBDIR"   # this step needs the path too (it prints the ld version below)
          {
            echo "BINUTILS=$BIN"
            echo "GCC=$GCC"
            echo "GCC_CRI=$HOME/tc/cri/bin/ee-gcc"
            echo "LD=$LD"
            echo "OBJDIFF=$PWD/objdiff-cli"
            echo "BINUTILS=$BIN"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:$LIBDIR"
          } >> "$GITHUB_ENV"
          echo "as  = $("$BIN/mips-ps2-decompals-as" --version | head -1)"
          echo "gcc = $("$GCC" --version | head -1)"
          echo "ld  = $("$LD" --version | head -1)"

      - name: Get the retail executable and check it
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          mkdir -p orig
          cp .orig/orig/SLPS_258.19 orig/SLPS_258.19
          sha1sum orig/SLPS_258.19
          python3 configure.py --game orig/SLPS_258.19

      - name: Get objdiff-cli and check its sha256
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          curl -fsSL -o objdiff-cli "$(python3 -c 'import json;print(json.load(open("toolchain.lock.json"))["tools"]["objdiff-cli"]["url"])')"
          echo "$(python3 -c 'import json;print(json.load(open("toolchain.lock.json"))["tools"]["objdiff-cli"]["sha256"])')  objdiff-cli" | sha256sum -c -
          chmod +x objdiff-cli
          echo "$PWD" >> "$GITHUB_PATH"
          echo "$BINUTILS" >> "$GITHUB_PATH"      # the step must also find as, objcopy, and readelf

      - name: Install splat (pinned, the version in toolchain.lock.json)
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip' && steps.snapshot.outputs.verdict != 'snapshot'
        run: python3 -m pip install --quiet -r tools/ci/splat-requirements.txt

      - name: Repository check
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: make check

      - name: Build and check the payload (the payload check)
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        # When the snapshot restored the assembled objects (the `asm` group), build.sh skips the
        # assembler and only checks that the object count matches the source count.
        # 快照若还原了汇编产物（`asm` 组），build.sh 会跳过汇编，只核对对象数与源文件数是否一致。
        env:
          BASELINE_ASM_PREBAKED: ${{ contains(steps.snapshot.outputs.groups, 'asm') && '1' || '0' }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "fast" ]; then
            echo "::notice::fast mode: the baseline is assembled without its link; the mixed payload is still asserted."
            make build-fast
          else
            make build
          fi

      - name: Delta check. Each changed file in src/matched/ must match 100%.
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request has no github.event.before. Without this the step printed
          # "First push. Skip the delta check." on every pull request and never ran the check.
          # PR 事件里没有 github.event.before；不改这里，这一步会在每个 PR 上打印
          # “First push. Skip the delta check.”，即从来没有真正跑过。
          set -u
          BASE="${PR_BASE:-}"
          if [ -z "$BASE" ]; then BASE="${BEFORE:-}"; fi
          case "$BASE" in
            ""|*0000000000000000000000000000000000000000)
              echo "No base commit (a manual run or the first push). Skip the delta check. The full build checked the payload." ;;
            *)
              git fetch --quiet origin "$BASE" || true
              make delta BASE="$BASE"
            ;;
          esac

      # `make report` writes build/SLPS_258.19_report.json and build/report_provenance.json.
      # `progress/**` is written only by tools/maintainer/publish_report.py, so a CI run never
      # touches the published, hash-pinned copy in the checkout.
      # `make report` 写 build/SLPS_258.19_report.json 与 build/report_provenance.json；
      # `progress/**` 只由 publish_report.py 写入，CI 不会碰检出里已发布、已锁哈希的那份。
      - name: Write the progress report
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: make report

      - name: The report must not be worse than the baseline
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        run: python3 tools/check/check_public_repo.py --compare-only --baseline progress/baseline.json --report build/SLPS_258.19_report.json

      # The steps above must all pass to reach this step. A failed run writes no
      # report artifact. Therefore decomp.dev never receives an unverified number.
      - name: Publish the progress report (decomp.dev needs this exact name)
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: SLPS_258.19_report
          path: build/SLPS_258.19_report.json
          if-no-files-found: error

      # The provenance record proves WHAT was measured: the payload sha1 the build asserted, the
      # commit, the dirty flag, and how many C units are below 100 percent. `publish_report.py`
      # refuses to publish without it. It is a separate artifact, so decomp.dev keeps seeing
      # exactly one file in `SLPS_258.19_report`.
      # provenance 记录「到底量了什么」：构建断言的载荷 sha1、提交号、工作树是否脏、有多少 C 单元
      # 不足 100%。publish_report.py 没有它就拒绝发布。它是**独立** artifact，decomp.dev 仍只在
      # `SLPS_258.19_report` 里看到一个文件。
      - name: Publish the report provenance
        if: env.HAS_ORIG == 'true' && steps.mode.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: SLPS_258.19_report_provenance
          path: build/report_provenance.json
          if-no-files-found: error
