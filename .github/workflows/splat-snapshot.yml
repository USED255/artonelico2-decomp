# Pack the `splat split` output and the assembled objects on a GitHub runner, and
# upload the archive as an artifact. Both go into one archive: the raw splat output and
# `build/asm/**/*.o` (see tools/ci/splat_snapshot.py).
#
# Why this runs here and not on a workstation: `splat split` needs about 150 s on a 4 vCPU
# runner and peaks at about 1.3 GB of resident memory. On a small workstation it swaps
# instead and can take the machine down (that happened on 2026-10-12). tools/ci/splat_snapshot.py
# refuses to run without memory headroom, and this workflow is the sanctioned way to pack.
#
# When the write-scoped deploy key is configured (the environment secret
# ORIG_DEPLOY_KEY_WRITE on the protected `splat-snapshot` environment), the job pushes the archive
# straight into the private companion repository, so it never enters this public repository's
# Actions storage. Without that key it falls back to the handoff artifact with `retention-days: 1`.
# Either way the maintainer commits `toolchain/splat-snapshot.json`. See docs/BUILD.md section 4.
#
# 为什么在 runner 上打包：`splat split` 在 4 vCPU runner 上约 150 s、峰值常驻内存约 1.3 GB；
# 小机器上会换成换页，甚至把机器拖死（2026-10-12 发生过）。tools/ci/splat_snapshot.py 在没有
# 内存余量时拒绝运行，本 workflow 是唯一被认可的打包路径。
#
# 配置了写权限部署密钥时（受保护的 `splat-snapshot` 环境上的环境 secret ORIG_DEPLOY_KEY_WRITE），
# 本 job 把归档**直接推进私有伴生仓库**，因此它不会出现在公开仓库的 Actions 存储里；没有该密钥时
# 回落到保留一天的中转 artifact。两种情况都由维护者提交 `toolchain/splat-snapshot.json`。
name: splat-snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    # This workflow is manual-only, so a protected environment costs no automation time. It puts a
    # human approval in front of the write-scoped deploy key (an environment secret) that the
    # push step uses (R30 findings A1/A4).
    # 本 workflow 只能手动触发 ⇒ 受保护环境不影响任何自动运行。它把推送步骤要用的写权限部署密钥
    # （环境 secret）挡在人工批准之后（R30 A1/A4）。
    environment: splat-snapshot
    timeout-minutes: 30
    env:
      HAS_ORIG: ${{ secrets.ORIG_DEPLOY_KEY != '' && vars.PRIVATE_ORIG_REPO != '' }}
      HAS_WRITE: ${{ secrets.ORIG_DEPLOY_KEY_WRITE != '' }}
      PRIVATE_ORIG_REPO: ${{ vars.PRIVATE_ORIG_REPO }}
    steps:
      - name: Notice (no secret, so there is nothing to pack)
        if: env.HAS_ORIG != 'true'
        run: |
          echo "::notice::The secret ORIG_DEPLOY_KEY or the variable PRIVATE_ORIG_REPO is absent. Nothing to pack."

      - name: Checkout this repository
        if: env.HAS_ORIG == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the private companion (retail executable)
        if: env.HAS_ORIG == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_ORIG_REPO }}
          ssh-key: ${{ secrets.ORIG_DEPLOY_KEY }}
          path: .orig
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: env.HAS_ORIG == 'true'
        with:
          python-version: '3.13'

      - name: Install splat (the pinned version)
        if: env.HAS_ORIG == 'true'
        run: python3 -m pip install --quiet -r tools/ci/splat-requirements.txt

      # The archive carries the assembled objects too, so this job needs the same Sony
      # toolchain that `matching-gate` uses (same sha256 checks). Keep these two steps in sync
      # with matching-gate.yml.
      # 归档也带汇编产物，因此这个 job 需要 `matching-gate` 用的同一套 Sony 工具链（同样的 sha256
      # 校验）。这两步要与 matching-gate.yml 保持同步。
      - name: Install the toolchain and check each sha256
        if: env.HAS_ORIG == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tc"
          for a in e32.tar.xz ee-gcc2.96.tar.xz b10.tar.gz ld244.tar.xz; do
            cp ".orig/toolchain/$a" "$HOME/tc/$a"
          done
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          lock = json.loads(pathlib.Path("toolchain.lock.json").read_text())
          want = {c["archive"]: c["sha256"] for c in lock["compilers"].values()}
          for name, digest in want.items():
              p = pathlib.Path.home() / "tc" / name
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != digest:
                  sys.exit(f"sha256 mismatch for {name}: {got} != {digest}")
              print(f"ok {name} {got}")
          PY
          mkdir -p "$HOME/tc/e32" "$HOME/tc/cri" "$HOME/tc/bin" "$HOME/tc/ld"
          tar -xf "$HOME/tc/e32.tar.xz"        -C "$HOME/tc/e32"   # ee-gcc 3.2-ee-040921
          tar -xf "$HOME/tc/ee-gcc2.96.tar.xz" -C "$HOME/tc/cri"   # ee-gcc 2.96 (spare)
          tar -xf "$HOME/tc/b10.tar.gz"        -C "$HOME/tc/bin"   # PS2 binutils (the archive is flat)
          tar -xf "$HOME/tc/ld244.tar.xz"      -C "$HOME/tc/ld"    # the Debian 2.44 ld and its libraries
          {
            echo "BINUTILS=$HOME/tc/bin"
          } >> "$GITHUB_ENV"

      - name: Pack the splat output and the assembled objects
        if: env.HAS_ORIG == 'true'
        run: |
          set -euo pipefail
          mkdir -p orig
          cp .orig/orig/SLPS_258.19 orig/SLPS_258.19
          python3 tools/ci/splat_snapshot.py create \
            --project . \
            --game orig/SLPS_258.19 \
            --splat "$(command -v splat)" \
            --with-asm \
            --as "$BINUTILS/mips-ps2-decompals-as" \
            --out .tmp/splat-SLPS_258.19.tar.zst \
            --manifest toolchain/splat-snapshot.json \
            --remote-path toolchain/splat-SLPS_258.19.tar.zst \
            --scratch .tmp/splat-snapshot

      # The archive is material this project cannot publish, so it must not sit in this public
      # repository's Actions storage. With the write key it goes straight into the private
      # companion repository (R30 finding A1); without the key the job falls back to a one-day
      # handoff artifact below.
      # 归档属不可公开材料，不能留在公开仓库的 Actions 存储里。有写密钥时直接进私有伴生仓库（R30 A1）；
      # 没有密钥则回落到下面那个只保留一天的中转 artifact。
      - name: Checkout the private companion with the write key
        if: env.HAS_ORIG == 'true' && env.HAS_WRITE == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_ORIG_REPO }}
          ssh-key: ${{ secrets.ORIG_DEPLOY_KEY_WRITE }}
          path: .orig-write
          fetch-depth: 1

      - name: Push the archive into the private companion repository
        if: env.HAS_ORIG == 'true' && env.HAS_WRITE == 'true'
        run: |
          set -euo pipefail
          mkdir -p .orig-write/toolchain
          cp .tmp/splat-SLPS_258.19.tar.zst .orig-write/toolchain/
          cp toolchain/splat-snapshot.json .orig-write/toolchain/
          cd .orig-write
          git config user.name "splat-snapshot (CI)"
          git config user.email "ci@users.noreply.github.com"
          git add toolchain/splat-SLPS_258.19.tar.zst toolchain/splat-snapshot.json
          if git diff --cached --quiet; then
            echo "::notice::the companion repository already holds this archive; nothing to push"
            exit 0
          fi
          git commit -q -m "toolchain: splat snapshot $(git -C .. rev-parse --short HEAD)"
          git push

      - name: Show what to do with the results
        if: env.HAS_ORIG == 'true'
        run: |
          set -euo pipefail
          {
            echo "## splat snapshot packed"
            echo
            if [ "${HAS_WRITE}" = "true" ]; then
              echo "The archive went straight into the private companion repository at"
              echo "\`toolchain/splat-SLPS_258.19.tar.zst\`. It never entered this repository's"
              echo "Actions storage."
              echo
              echo "Next: commit \`toolchain/splat-snapshot.json\` in this repository (the"
              echo "\`splat-snapshot\` artifact holds it)."
            else
              echo "No write key is configured, so the archive is offered as a one-day handoff."
              echo
              echo "1. Download the \`splat-snapshot-archive\` artifact (deleted after one day)."
              echo "2. Copy the archive into the private companion repository:"
              echo "   \`toolchain/splat-SLPS_258.19.tar.zst\`"
              echo "3. Commit \`toolchain/splat-snapshot.json\` in this repository."
            fi
            echo
            echo "sha256 of the archive:"
            echo
            echo '```'
            sha256sum .tmp/splat-SLPS_258.19.tar.zst
            echo '```'
            echo
            echo "manifest:"
            echo
            echo '```json'
            cat toolchain/splat-snapshot.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The manifest is public data (hashes and counts), so it travels as an ordinary artifact.
      # 清单是公开数据（哈希与计数），按普通 artifact 传递。
      - name: Upload the manifest
        if: env.HAS_ORIG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: splat-snapshot
          path: toolchain/splat-snapshot.json
          if-no-files-found: error

      # Fallback only: no write key means the archive still needs a handoff path. `retention-days: 1`
      # is the shortest GitHub allows (R30 finding A1).
      # 仅回落路径：没有写密钥时归档仍需要一个中转。`retention-days: 1` 是 GitHub 允许的最短保留期（R30 A1）。
      - name: Upload the archive as a one-day handoff (only without the write key)
        if: env.HAS_ORIG == 'true' && env.HAS_WRITE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: splat-snapshot-archive
          path: .tmp/splat-SLPS_258.19.tar.zst
          retention-days: 1
          if-no-files-found: error
