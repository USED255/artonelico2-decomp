# Fast checks. No secret is necessary.
#
# Two modes:
#   push / manual   -> strict mode. The public tree must equal the exporter output.
#   pull_request    -> contribution mode. A pull request may add or change files
#                      in the contribution paths only. See CONTRIBUTING.md.
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the contribution mode needs the base commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Strict check (the public tree must equal the exporter output)
        if: github.event_name != 'pull_request'
        run: make check

      - name: Contribution check (pull request)
        if: github.event_name == 'pull_request'
        run: python3 tools/check/check_public_repo.py --pr "${{ github.event.pull_request.base.sha }}"
