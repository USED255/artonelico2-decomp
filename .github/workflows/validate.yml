# Fast checks. No secret is necessary.
#
# Two modes:
#   push to main / manual -> repository checks + publication record.
#   pull_request          -> contribution mode. A same-repository pull request may add,
#                            change, rename, or delete files. A pull request from a fork
#                            may add or change files only. See CONTRIBUTING.md.
#
# A push to a feature branch does not run this workflow: the pull request run already
# covers that commit, so running both would double every contribution push (measured:
# two runs of 10-12 s each).
# 推送到功能分支不再重复跑：同一次提交的 PR run 已经覆盖它（实测每个 push 会跑两份 10–12 s）。
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the contribution mode needs the base commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Repository checks (publication record, report, baseline)
        if: github.event_name != 'pull_request'
        run: make check

      - name: Contribution check (pull request)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          args=(--pr "${{ github.event.pull_request.base.sha }}")
          # A same-repository pull request may rename or delete files. A fork pull request stays strict.
          # 同仓库 PR 允许重命名与删除；外部 fork PR 保持严格。
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            args+=(--allow-restructure)
            # `main` is protected by a ruleset, so a maintainer publishes through a pull request
            # too. `--allow-publication` admits a *pure* publication change and then verifies the
            # record, the provenance-carrying baseline, and the no-regression rule.
            # 维护者也要走 PR 发布（main 受规则集保护）。`--allow-publication` 只接受**纯发布**改动，
            # 并校验记录、带 provenance 的基线与不回归。
            case "$AUTHOR_ASSOC" in
              OWNER|MEMBER|COLLABORATOR) args+=(--allow-publication) ;;
            esac
          fi
          python3 tools/check/check_public_repo.py "${args[@]}"
